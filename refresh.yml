name: Refresh data

on:
  schedule:
    - cron: "0 9 * * *"   # daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        env:
          FEED_URL_EXAMPLE: ${{ secrets.FEED_URL_EXAMPLE }}
        run: python3 fetch.py
      - name: Test build
        run: python3 build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json
          git diff --staged --quiet || (git commit -m "Refresh product data" && git push)
